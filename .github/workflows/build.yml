# Cloud build for GoRhanHee/kernel_samsung_sm8250
# Galaxy S20 / S20+ / S20 Ultra  (Snapdragon 865, kona / sm8250)
#
# The tree cannot be built as-is, because two things it depends on are not in it:
#
#   1. toolchain/
#      build.sh sets
#        CROSS_COMPILE=<repo>/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
#        CLANG=<repo>/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
#      and the top-level Makefile hardcodes
#        REAL_CC = $(srctree)/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
#
#      "llvm-arm-toolchain-ship" is Qualcomm's proprietary Snapdragon LLVM, NOT
#      AOSP clang, and it is not downloadable without a Qualcomm account. That is
#      why substituting a distro clang cannot work: every compile goes through
#      scripts/gcc-wrapper.py, whose warning allow-list is only three lines, so a
#      different clang trips it and aborts the build. The kernel author publishes
#      the exact pair he built against in a separate repository - that is what we
#      fetch here.
#
#   2. KernelSU-Next/
#      The tree carries a gitlink for it but ships no .gitmodules, so no clone
#      can ever fetch it. drivers/kernelsu is a symlink to
#      ../KernelSU-Next/kernel, so the checkout has to sit at the repo root
#      (a copy under drivers/kernelsu/ would NOT be used). Pinned to the commit
#      this kernel was actually developed against - the kernel's last commit,
#      "Fix avc.c file", lands one day after it.
#
name: Build SM8250 Kernel

on:
  workflow_dispatch:
    inputs:
      model:
        description: Which model to build
        required: true
        default: all
        type: choice
        options:
          - all
          - G981N
          - G986N
          - G988N
      ksu_ref:
        description: 'KernelSU-Next revision: tag, branch or commit. Leave empty for the commit this kernel was written against.'
        required: false
        default: ""
        type: string
      disable_encryption:
        description: 'Patch the ramdisk fstab so /data is no longer force-encrypted'
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - x1q
    paths:
      - .github/workflows/build.yml
      - build.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAIN_URL: https://github.com/GoRhanHee/aarch64-android-4.9_llvm-10.0.git
  TOOLCHAIN_BRANCH: toolchain
  KSU_URL: https://github.com/KernelSU-Next/KernelSU-Next.git
  KSU_COMMIT: effdc4fc06820afde70dd1b5e94658304efdb2ab

jobs:
  prepare:
    name: Resolve targets
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          x1q='{"model":"G981N","device":"x1q"}'
          y2q='{"model":"G986N","device":"y2q"}'
          z3q='{"model":"G988N","device":"z3q"}'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.model }}" != "all" ]; then
            case "${{ inputs.model }}" in
              G981N) picked="$x1q" ;;
              G986N) picked="$y2q" ;;
              G988N) picked="$z3q" ;;
            esac
            echo "matrix={\"include\":[$picked]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$x1q,$y2q,$z3q]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.model }} (${{ matrix.device }})
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          # build.sh hardcodes -j16, but a hosted runner only has 4 vCPU / 16 GB.
          # Swap keeps the parallel clang jobs from OOM-killing each other.
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Check out kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          # No aarch64 cross compiler is installed on purpose: the toolchain
          # fetched below provides its own. Pulling in the distro one is exactly
          # what makes other attempts fail.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential cpio zip unzip tar xz-utils \
            python3 python-is-python3

          # Qualcomm's Snapdragon clang 10 is an old binary: it links against
          # libtinfo.so.5 / libncurses.so.5, and Ubuntu 22.04 only ships the
          # .so.6 versions. Without them the compiler cannot start at all
          # ("error while loading shared libraries: libtinfo.so.5"), which is
          # what the first run of this workflow hit. Prefer the real packages,
          # fall back to a symlink - terminfo's ABI is compatible for the
          # symbols clang actually uses.
          sudo apt-get install -y --no-install-recommends libtinfo5 libncurses5 || true
          for lib in tinfo ncurses; do
            if ! ldconfig -p | grep -q "lib${lib}\.so\.5"; then
              src=$(ldconfig -p | awk -v pat="lib${lib}.so.6 " 'index($0, pat) { print $NF; exit }')
              if [ -n "$src" ]; then
                sudo ln -sf "$src" "/usr/lib/x86_64-linux-gnu/lib${lib}.so.5"
                echo "symlinked $src -> lib${lib}.so.5"
              else
                echo "::warning::could not locate lib${lib}.so.6 to symlink"
              fi
            fi
          done
          sudo ldconfig

          # scripts/gcc-wrapper.py is run as `python <script> <real cc>` - the
          # Makefile sets CC = $(PYTHON) .../gcc-wrapper.py $(REAL_CC) with
          # PYTHON = python. Its shebang still says python2, but Ubuntu 22.04
          # ships no bare `python` at all, while the script body handles both
          # versions. python-is-python3 is therefore sufficient; the shebang is
          # never consulted on this path.
          python --version

      - name: Fetch toolchain
        run: |
          git clone --depth=1 --branch "${TOOLCHAIN_BRANCH}" "${TOOLCHAIN_URL}" toolchain
          du -sh toolchain

      - name: Verify the toolchain actually runs
        run: |
          clang="toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"
          gcc="toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc"

          echo "dynamic dependencies of Qualcomm's clang:"
          ldd "$clang" | sed 's/^/  /'

          if ldd "$clang" | grep -q 'not found'; then
            echo "::error::the toolchain clang cannot start - unresolved shared libraries are listed above"
            exit 1
          fi

          echo
          echo "clang: $("$clang" --version | head -n 1)"
          echo "gcc:   $("$gcc" --version | head -n 1)"

          # These are the very probes init/Kconfig runs through $(shell,...) and
          # $(success,...). Their output is expanded straight into the Kconfig
          # text, so anything multi-line or quoted coming out of them derails the
          # parser and surfaces as "syntax error" a couple of lines further down
          # instead of pointing here.
          echo
          echo "Kconfig compiler probes:"
          echo "--- scripts/gcc-version.sh ---"
          sh scripts/gcc-version.sh -p "$PWD/$clang" 2>&1 | head -n 3
          echo "--- scripts/clang-version.sh ---"
          sh scripts/clang-version.sh "$PWD/$clang" 2>&1 | head -n 3
          echo "--- through gcc-wrapper.py, i.e. how CC is really invoked ---"
          python scripts/gcc-wrapper.py "$PWD/$clang" --version 2>&1 | head -n 3

      - name: Fetch KernelSU-Next
        run: |
          # Which revision to use. Empty means "whatever the repository's gitlink
          # pins", which is the commit this kernel was written against - its last
          # commit, "Fix avc.c file", is dated one day after that KernelSU-Next
          # commit, so the two were clearly developed together.
          #
          # A newer upstream revision can be requested from the dispatch form
          # (e.g. v3.4.0, or main). KernelSU-Next's kernel-side code changes
          # between releases, and this kernel tree is from 2025-08, so a newer
          # revision may or may not compile against it. The build log says which
          # one was used, so a failure is easy to attribute.
          ref="${{ inputs.ksu_ref }}"
          if [ -z "$ref" ]; then
            ref="${KSU_COMMIT}"
          fi
          echo "KernelSU-Next revision: $ref"
          echo "KSU_RESOLVED_REF=$ref" >> "$GITHUB_ENV"

          git init KernelSU-Next
          git -C KernelSU-Next remote add origin "${KSU_URL}"
          git -C KernelSU-Next fetch --depth=1 origin "$ref"
          git -C KernelSU-Next checkout --detach FETCH_HEAD
          git -C KernelSU-Next log -1 --format='%H %ad %s' --date=short

      - name: Verify prerequisites
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          fail=0
          check() {
            if [ -e "$1" ]; then
              echo "  ok      $1"
            else
              echo "::error::missing $1"
              fail=1
            fi
          }

          echo "checking toolchain and KernelSU layout"
          check "toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"
          check "toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc"
          check "KernelSU-Next/kernel/Kconfig"
          check "arch/arm64/configs/vendor/${DEVICE}_kor_singlex_defconfig"
          check "AIK_${DEVICE}/repackimg.sh"

          if [ "$fail" -ne 0 ]; then
            echo "::group::toolchain layout"
            find toolchain -maxdepth 4 -type d | head -40
            echo "::endgroup::"
            exit 1
          fi

          # drivers/kernelsu -> ../KernelSU-Next/kernel must now resolve
          echo "drivers/kernelsu resolves to:"
          ls -la drivers/kernelsu | head -5

      - name: Fix file permissions
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          chmod +x build.sh
          chmod +x tools/dtc 2>/dev/null || true
          find "AIK_${DEVICE}" -name '*.sh' -exec chmod +x {} \;
          find "AIK_${DEVICE}/bin" -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Disable forced encryption in the ramdisk
        if: inputs.disable_encryption == 'true'
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          fstab="AIK_${DEVICE}/ramdisk/fstab.qcom"

          if [ ! -f "$fstab" ]; then
            echo "::error::$fstab not found, cannot patch encryption"
            exit 1
          fi

          echo "before:"
          grep -n 'by-name/userdata' "$fstab" || true

          # Only the /data line is touched. The very same fileencryption=ice flag
          # also sits on /keydata and /keyrefuge, which are Samsung ODE
          # partitions backing Knox. Clearing those breaks Knox and can stop the
          # device from booting, so they are deliberately left alone. Anchoring
          # the substitution on "by-name/userdata" achieves that.
          #
          # The edit reaches the final image: build.sh runs repackimg.sh with no
          # arguments, and that script rebuilds the ramdisk from this directory
          # unless --original is passed.
          sed -i -e 's|\(by-name/userdata.*\)fileencryption=|\1encryptable=|' \
                 -e 's|\(by-name/userdata.*\)forceencrypt|\1encryptable=ice|' "$fstab"

          echo "after:"
          grep -n 'by-name/userdata' "$fstab" || true

          if ! grep 'by-name/userdata' "$fstab" | grep -q 'encryptable='; then
            echo "::error::the /data entry still has no encryptable= flag - nothing was changed"
            exit 1
          fi

          echo "::warning::/data is no longer force-encrypted. This only takes effect after a factory reset, and it wipes existing user data."

      - name: Build
        env:
          DEVICE: ${{ matrix.device }}
        run: bash build.sh ${{ matrix.model }}

      - name: Verify artifacts
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          tar_file="gorhanhee/${DEVICE}_SuSFS.tar"

          if [ ! -f "$tar_file" ]; then
            echo "::error::$tar_file was not produced"
            echo "::group::gorhanhee/"
            ls -la gorhanhee/ 2>/dev/null || echo "(no gorhanhee directory)"
            echo "::endgroup::"
            echo "::group::out/arch/arm64/boot"
            ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(no boot directory)"
            echo "::endgroup::"
            exit 1
          fi

          # build.sh copies the kernel image into the AIK split_img without
          # checking the copy and without `set -e`. If the produced image is not
          # named Image-dtb the cp fails, the script carries on, and repackimg.sh
          # packs the stock kernel that was already sitting in
          # AIK_<device>/split_img - yielding a boot.img that looks perfectly
          # valid but boots the old kernel. Assert the copy really happened.
          image="out/arch/arm64/boot/Image-dtb"
          if [ ! -f "$image" ]; then
            echo "::error::$image was not produced"
            echo "::group::out/arch/arm64/boot"
            ls -la out/arch/arm64/boot/ 2>/dev/null || echo "(missing)"
            echo "::endgroup::"
            exit 1
          fi

          if ! cmp -s "$image" "AIK_${DEVICE}/split_img/boot.img-kernel"; then
            echo "::error::AIK_${DEVICE}/split_img/boot.img-kernel differs from the built image - the repack used the wrong kernel"
            ls -la "$image" "AIK_${DEVICE}/split_img/boot.img-kernel"
            exit 1
          fi
          echo "repacked kernel matches the built image ($(du -h "$image" | cut -f1))"

          ls -la gorhanhee/
          echo "::group::archive contents"
          tar -tvf "$tar_file"
          echo "::endgroup::"

          echo "KernelSU-Next revision used: ${KSU_RESOLVED_REF:-<default>}"

          echo "::group::KernelSU / SuSFS symbols in out/.config"
          grep -E '^CONFIG_(KSU|SUSFS)' out/.config || echo "(none found)"
          echo "::endgroup::"

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "::warning::CONFIG_KSU is not enabled - this build has no KernelSU"
          fi

          # keep the config and the revision next to the images, so an artifact
          # is self-describing now that the KernelSU-Next revision is selectable
          cp out/.config "gorhanhee/${DEVICE}_kernel_config.txt"
          {
            echo "device:              ${DEVICE} (${{ matrix.model }})"
            echo "kernel commit:       $(git rev-parse HEAD)"
            echo "KernelSU-Next ref:   ${KSU_RESOLVED_REF:-<default>}"
            echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse HEAD)"
            echo "toolchain:           $(toolchain/llvm-arm-toolchain-ship/10.0/bin/clang --version | head -1)"
          } > "gorhanhee/${DEVICE}_build_info.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-${{ matrix.device }}-SuSFS
          path: gorhanhee/
          if-no-files-found: error
          retention-days: 30

